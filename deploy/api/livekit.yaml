# LiveKit SFU: голос, камеры и показ экрана. Сигналинг слушает только localhost, снаружи — через Caddy (/rtc).
port: 7880
bind_addresses:
  - 127.0.0.1
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  node_ip: __IP__
turn:
  enabled: true
  domain: __DOMAIN__
  udp_port: 3478
  relay_range_start: 30000
  relay_range_end: 30999
keys:
  __KEY__: __SECRET__
room:
  empty_timeout: 300
  departure_timeout: 20
  max_participants: 16
logging:
  level: info
