<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <meta name="theme-color" content="#1c1b27" />
    <title>kinō — 3D-комната команды</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
  </head>
  <body>
    <main id="viewport">
      <canvas
        id="world"
        tabindex="0"
        aria-label="3D-комната. WASD или стрелки — движение, пробел — прыжок, левый клик — снежок."
      ></canvas>
      <div id="loading">
        <span class="loading-mark">k</span><span>Открываем пространство…</span>
      </div>
    </main>
    <div id="objectHint" class="object-hint" hidden></div>
    <div id="contextBar" class="context-island" hidden></div>
    <div id="timerIsland" class="timer-island" hidden>
      <button data-action="timer" id="timerToggle" title="Пауза">Ⅱ</button
      ><button data-action="timerSettings" id="timerText">05:00</button
      ><button data-action="timerClose" title="Скрыть">×</button>
    </div>
    <nav class="island" aria-label="Инструменты комнаты">
      <button class="logo-button" data-action="room" title="Комната и итоги">
        k<span class="tip">Комната</span>
      </button>
      <div class="divider"></div>
      <button class="tool active" data-tool="snow" title="Снежок — левый клик">
        <span data-icon="snow"></span
        ><span class="tip">Снежок · клик</span></button
      ><button class="tool" data-tool="interact" title="Взаимодействовать (V)">
        <span data-icon="hand"></span
        ><span class="tip">Взаимодействовать · V</span></button
      ><button class="tool" data-tool="note" title="Поставить стикер (N)">
        <span data-icon="note"></span
        ><span class="tip">Стикер · N</span></button
      ><button class="tool" data-tool="cube" title="Поставить кубик (C)">
        <span data-icon="cube"></span><span class="tip">Кубик · C</span></button
      ><button class="tool" data-action="avatar" title="Мой аватар">
        <span data-icon="person"></span><span class="tip">Мой аватар</span>
      </button>
      <div class="divider"></div>
      <button class="tool" data-action="board" title="Доска ретро">
        <span data-icon="board"></span
        ><span class="tip">Доска ретро</span></button
      ><button class="tool" data-action="timerSettings" title="Таймер">
        <span data-icon="clock"></span><span class="tip">Таймер</span></button
      ><button class="tool" data-action="reaction" title="Реакция">
        <span data-icon="smile"></span><span class="tip">Реакция</span>
      </button>
      <div class="divider"></div>
      <button class="tool off" data-action="mic" id="micBtn" title="Микрофон">
        <span data-icon="mic"></span><span class="tip">Микрофон</span
        ><i class="slash"></i></button
      ><button class="tool off" data-action="camera" id="camBtn" title="Камера">
        <span data-icon="video"></span><span class="tip">Камера</span
        ><i class="slash"></i></button
      ><button
        class="tool"
        data-action="share"
        id="shareBtn"
        title="Показать экран"
      >
        <span data-icon="screen"></span><span class="tip">Показать экран</span>
      </button>
      <div class="divider"></div>
      <button class="tool" data-action="view" title="Ракурс и масштаб">
        <span data-icon="orbit"></span><span class="tip">Ракурс</span></button
      ><button class="tool" data-action="help" title="Управление">
        <span data-icon="help"></span><span class="tip">Управление</span>
      </button>
    </nav>
    <div id="touchControls">
      <div class="dpad">
        <button data-move="up" aria-label="Вперёд">↑</button
        ><button data-move="left" aria-label="Влево">←</button
        ><button data-move="down" aria-label="Назад">↓</button
        ><button data-move="right" aria-label="Вправо">→</button>
      </div>
      <button id="touchJump" aria-label="Прыжок">↟</button>
    </div>
    <div id="toast" role="status"></div>
    <dialog id="modal"><div id="modalContent"></div></dialog>
    <div id="srStatus" class="sr-only" role="status"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
